[language-server.tsc]
command = "tsc"
args = ["--lsp", "--stdio"]

[language-server.oxlint]
command = "oxlint"
args = ["--lsp"]

[[language]]
name = "css"
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "go"
indent = { tab-width = 2, unit = "\t" }

[[language]]
name = "html"
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "javascript"
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
language-servers = ["tsc", "oxlint"]

[[language]]
name = "json"
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "jsonc"
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "jsx"
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
language-servers = ["tsc", "oxlint"]

[[language]]
name = "markdown"
auto-format = false
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "typescript"
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
language-servers = ["tsc", "oxlint"]

[[language]]
name = "tsx"
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
language-servers = ["tsc", "oxlint"]
